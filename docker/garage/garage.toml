# Configuración de Garage para desarrollo: un solo nodo, sin replicación.
# Los secretos de este archivo son solo para desarrollo.
metadata_dir = "/var/lib/garage/meta"
data_dir = "/var/lib/garage/data"
db_engine = "sqlite"

replication_factor = 1

rpc_bind_addr = "[::]:3901"
rpc_public_addr = "127.0.0.1:3901"
rpc_secret = "4f1c1a6e2b8d9e0f3a5c7b9d1e3f5a7c9b1d3e5f7a9c1b3d5e7f9a1c3b5d7e9f"

[s3_api]
s3_region = "garage"
api_bind_addr = "[::]:3900"
root_domain = ".s3.localhost"

[admin]
api_bind_addr = "[::]:3903"
admin_token = "amauta-dev-admin-token"
metrics_token = "amauta-dev-metrics-token"
